<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcription</title>
    <link rel="stylesheet" href="../css/output.css">
</head>
<body class="bg-gray-900/80 text-white font-sans text-sm overflow-hidden rounded-lg flex flex-col items-center justify-center h-screen backdrop-blur-sm">
    <!-- Animated Mic Button -->
    <div class="mb-3"> <!-- Added margin-bottom -->
        <div id="mic-indicator" class="circle w-16 h-16 rounded-full bg-white flex items-center justify-center shadow-lg transition-all duration-500 relative">
            <!-- Pulsing background element -->
            <div class="pulse absolute inset-0 w-16 h-16 rounded-full bg-gray-400 opacity-0 scale-100"></div>
            <!-- Mic Icon -->
            <svg id="mic-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#b2b1b1" class="w-7 h-7 transition-colors duration-900 z-10">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 0 1-3-3V4.5a3 3 0 1 1 6 0v8.25a3 3 0 0 1-3 3Z" />
            </svg>
        </div>
    </div>

    <!-- Transcription Text -->
    <div id="transcription-output" class="whitespace-pre-wrap break-words text-center max-w-xs">
        Listening...
    </div>

    <script src="../core/TranscriptionRenderer.js"></script>
</body>
</html>
